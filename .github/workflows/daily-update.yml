name: Daily Stock Update

on:
  schedule:
    # NSE market closes at 4:00 PM IST (10:30 UTC)
    # Cron format: minute hour day month day-of-week
    # GitHub Actions runs cron jobs in UTC
    # 4:00 PM IST = 10:30 UTC
    # We run at 10:35 UTC (5 min after market close) to allow for closing trades
    - cron: '35 18 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify India time zone
        run: |
          echo "Current system timezone:"
          date
          node -e "console.log('Node.js locale:', new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Kolkata'}).format(new Date()))"

      - name: Run daily update from NSE
        run: |
          node scripts/updateDaily.js

      - name: Build static site
        run: node scripts/build.js

      - name: Commit and push changes
        run: |
          git add data/ public/
          if ! git diff --cached --quiet; then
            git commit -m "📈 Daily NSE update - $(date +'%Y-%m-%d %H:%M:%S %Z')"
            git push || {
              echo "Push failed - attempting to recover..."
              git pull --rebase
              git push
            }
            echo "✅ Changes pushed successfully"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-logs
          path: |
            npm-debug.log
            *.log
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily update workflow failed!"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
