name: Fetch Historical Data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of stocks (for testing, leave empty for all)'
        required: false
        type: number
        default: 0

permissions:
  contents: write

jobs:
  fetch-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch historical data from NSE
        run: |
          LIMIT=${{ github.event.inputs.limit || 0 }}
          if [ "$LIMIT" -gt 0 ]; then
            node scripts/fetchHistorical.js $LIMIT
          else
            node scripts/fetchHistorical.js
          fi

      - name: Fill missing data in data folder
        run: |
          echo "Checking for and filling missing dates in existing data..."
          node scripts/fetchHistorical.js fill-missing

      - name: Build static site
        run: node scripts/build.js

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/ public/
          if ! git diff --cached --quiet; then
            git commit -m "📊 NSE historical data update - $(date +'%Y-%m-%d')"
            git push || {
              echo "Push failed - attempting to recover..."
              git pull --rebase
              git push
            }
            echo "✅ Changes pushed successfully"
          else
            echo "No changes to commit"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-historical-logs
          path: |
            npm-debug.log
            *.log
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Fetch historical workflow failed!"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
