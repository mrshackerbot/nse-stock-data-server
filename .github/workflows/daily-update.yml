name: Daily Stock Update

on:
  schedule:
    # NSE market closes at 4:00 PM IST (10:30 UTC)
    # Cron format: minute hour day month day-of-week
    # GitHub Actions runs cron jobs in UTC
    # 4:00 PM IST = 10:30 UTC
    # We run at 10:35 UTC (5 min after market close) to allow for closing trades
    - cron: '35 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify India time zone
        run: |
          echo "Current system timezone:"
          date
          node -e "console.log('Node.js locale:', new Intl.DateTimeFormat('en-US', {timeZone: 'Asia/Kolkata'}).format(new Date()))"

      - name: Run daily update from NSE
        run: |
          node scripts/updateDaily.js

      - name: Build static site
        run: node scripts/build.js

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/ public/
          if ! git diff --cached --quiet; then
            git commit -m "📈 Daily NSE update - $(date +'%Y-%m-%d %H:%M:%S %Z')"
            git push
          else
            echo "No changes to commit"
          fi
